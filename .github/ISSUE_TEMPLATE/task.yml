name: 작업
description: 기능·수정·문서·검증 작업
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 범위
      description: 해결할 문제, 포함 범위와 제외 범위를 적어주세요.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 작업 ID와 담당 역할
      placeholder: CHAR-001 / 언리얼 개발
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업과 관련 문서
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 확인 가능한 조건을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
    validations:
      required: true
